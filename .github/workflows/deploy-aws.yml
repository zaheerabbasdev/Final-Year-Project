name: Deploy to AWS ECS

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_BACKEND: academy-dev-backend
  ECR_REPOSITORY_FRONTEND: academy-dev-frontend
  ECR_REPOSITORY_ADMIN: academy-dev-admin
  ECS_CLUSTER: academy-dev-cluster
  ECS_SERVICE_BACKEND: academy-dev-backend
  ECS_SERVICE_FRONTEND: academy-dev-frontend
  ECS_SERVICE_ADMIN: academy-dev-admin
  S3_BUCKET: academy-dev-uploads

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://academy-dev-alb-1956712506.ap-south-1.elb.amazonaws.com/api \
            --build-arg NEXT_PUBLIC_WS_URL=http://academy-dev-alb-1956712506.ap-south-1.elb.amazonaws.com \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest ./web/kaarkun
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

      - name: Build and push admin image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://academy-dev-alb-1956712506.ap-south-1.elb.amazonaws.com/api \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_ADMIN:latest ./admin
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_ADMIN:latest

      - name: Register backend task definition with S3 env vars
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Comma-separated list of origins allowed to connect to the backend.
          # The ALB URL is included so Socket.IO accepts both web and mobile
          # connections that arrive through the load balancer.
          ALLOWED_ORIGINS: "http://academy-dev-alb-1956712506.ap-south-1.elb.amazonaws.com"
        run: |
          # Fetch the current task definition, strip read-only fields, then inject
          # the updated image and S3 environment variables.
          # NOTE: EMAIL_USER / EMAIL_PASS are managed via AWS Secrets Manager
          # through Terraform — do NOT inject them here as plain env vars.
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $ECS_SERVICE_BACKEND \
            --query 'taskDefinition' --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest" \
            --arg BUCKET "$S3_BUCKET" \
            --arg REGION "$AWS_REGION" \
            --arg ORIGINS "$ALLOWED_ORIGINS" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) |
             .containerDefinitions[0].image = $IMAGE |
             .containerDefinitions[0].environment = (
               (.containerDefinitions[0].environment // []) |
               map(select(
                 .name != "AWS_S3_BUCKET" and
                 .name != "AWS_REGION" and
                 .name != "ALLOWED_ORIGINS"
               )) +
               [
                 {"name":"AWS_S3_BUCKET","value":$BUCKET},
                 {"name":"AWS_REGION","value":$REGION},
                 {"name":"ALLOWED_ORIGINS","value":$ORIGINS}
               ]
             )')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "BACKEND_TASK_DEF_ARN=$NEW_ARN" >> $GITHUB_ENV

      - name: Update ECS services
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE_BACKEND \
            --task-definition $BACKEND_TASK_DEF_ARN
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE_FRONTEND \
            --force-new-deployment
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE_ADMIN \
            --force-new-deployment
